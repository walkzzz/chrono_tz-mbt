name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain version
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Type check all backends deny warnings
        run: moon check --deny-warn --target all

      - name: Test native target
        run: moon test --target native

      - name: Verify interface
        run: moon info
